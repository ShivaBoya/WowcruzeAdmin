<div class="login-page-container">
    <!-- Branding Header (Top Dark Navbar Strip) -->
    <div class="login-header-logo">
        <img src="./assets/Images/wc-logo.svg" alt="WowoCruze Logo">
    </div>

    <div class="login-content-center">
        <!-- WELCOME STATE -->
        <div *ngIf="loginState === 'WELCOME'" class="welcome-state text-center animate-fade-in">
            <div class="welcome-logo-container mb-4">
                <img src="./assets/Images/wc-logo.svg" alt="WowoCruze Large Logo" class="large-logo">
            </div>
            <div class="admin-label mb-2">ADMIN CONSOLE</div>
            <h1 class="welcome-heading">Welcome to <span class="text-gold">WOWCruze</span></h1>
            <p class="welcome-description mb-5">
                Manage assets, investors and KYC across the tokenized luxury mobility marketplace.
            </p>
            <button class="btn-admin-signin" (click)="enterSignIn()">
                <i class="fa fa-shield mr-2"></i> Admin Sign In <i class="fa fa-arrow-right ml-2"></i>
            </button>
        </div>

        <!-- SIGNIN STATE -->
        <div *ngIf="loginState === 'SIGNIN'" class="login-card-container animate-slide-up">
            <div class="login-card">
                <div class="step-indicator">
                    <div class="step-icon">
                        <i class="fa fa-envelope"></i>
                    </div>
                    <div class="step-text">
                        <h2 class="step-title">Admin Sign In</h2>
                    </div>
                </div>

                <div class="form-group mt-4">
                    <label class="input-label">Email address</label>
                    <div class="phone-input-wrapper" [class.error-border]="userNotExist || isError">
                        <input [(ngModel)]="email" name="email" type="email"
                            placeholder="Enter your email" class="main-input">
                    </div>
                </div>

                <div class="form-group mt-4">
                    <label class="input-label">Password</label>
                    <div class="phone-input-wrapper" [class.error-border]="isError">
                        <input [(ngModel)]="password" name="password" type="password"
                            placeholder="Enter your password" class="main-input">
                    </div>
                    <div *ngIf="userNotExist" class="error-text">No admin found with this email</div>
                    <div *ngIf="isError && !userNotExist" class="error-text">Invalid email or password</div>
                </div>

                <button class="btn-login-action mt-4" (click)="signIn()" [disabled]="!email || !password">
                    <span>Sign In</span> <i class="fa fa-sign-in ml-2"></i>
                    <i class="fa fa-spinner rotate ml-2" id="loginLoaderSignInId" style="display: none;"></i>
                </button>

            </div>
        </div>
    </div>

    <!-- Page Footer -->
    <!-- <div class="login-page-footer">
        Need help? <a href="#" class="footer-link">Contact support</a>
    </div> -->
</div>
